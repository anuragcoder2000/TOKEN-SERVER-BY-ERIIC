<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<title>ERIIC + ANURAG MISHRA V7 TOKEN GENERATOR</title>
<style>
    :root{
        --neon:#00b894; --neon2:#7b2ff7; --neon3:#ff2d95;
        --bg:#f4f6fb; --text:#1a1a2e; --muted:#6b7280;
        --err:#e11d48; --warn:#d97706; --ok:#16a34a; --line:#e5e7eb;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{
        font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
        background:radial-gradient(circle at 12% 8%, rgba(0,184,148,.12), transparent 45%),
                   radial-gradient(circle at 88% 92%, rgba(123,47,247,.12), transparent 50%),
                   var(--bg);
        color:var(--text); margin:0; min-height:100dvh;
        display:flex; justify-content:center; align-items:center; padding:16px; overflow-x:hidden;
    }
    .container{
        position:relative; z-index:2; width:100%; max-width:430px;
        background:rgba(255,255,255,.95); backdrop-filter:blur(18px);
        border-radius:24px; border:1px solid rgba(0,184,148,.25);
        box-shadow:0 20px 60px rgba(30,30,60,.12);
        padding:22px 20px; text-align:center; overflow:hidden;
        animation:cardIn .8s cubic-bezier(.2,.9,.3,1.2) both;
    }
    @keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.94);}to{opacity:1;transform:none;}}
    
    .brand{margin-bottom:15px;}
    h1{margin:0; font-size:1.25rem; font-weight:900; letter-spacing:1px; line-height:1.25;}
    h1 .amp{color:var(--neon3);}
    h1 .v7{background:linear-gradient(135deg,var(--neon3),var(--neon2)); color:#fff; padding:2px 8px; border-radius:6px; font-size:0.65rem; vertical-align:middle; margin-left:4px;}

    /* TABS */
    .tabs{display:flex; background:#f3f4f6; border-radius:12px; padding:4px; margin-bottom:20px;}
    .tab-btn{flex:1; padding:10px; border:none; background:none; font-weight:700; font-size:0.85rem; color:var(--muted); border-radius:8px; cursor:pointer; transition:0.3s;}
    .tab-btn.active{background:#fff; color:var(--neon); box-shadow:0 2px 8px rgba(0,0,0,0.08);}

    .input-group{margin-bottom:12px; text-align:left;}
    label{display:block; margin-bottom:6px; color:#4b5563; font-size:.75rem; font-weight:600;}
    input{
        width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line);
        background:#f9fafb; color:var(--text); font-size:.95rem; outline:none; transition:.2s;
    }
    input:focus{border-color:var(--neon); background:#fff; box-shadow:0 0 0 3px rgba(0,184,148,.13);}

    .main-btn{
        width:100%; padding:14px; border:none; border-radius:11px;
        background:linear-gradient(135deg,var(--neon) 0%, #00ceaa 60%, var(--neon2) 140%);
        color:#fff; font-weight:900; font-size:.9rem; cursor:pointer; transition:0.3s;
        box-shadow:0 4px 15px rgba(0,184,148,.35);
    }
    .main-btn:hover{transform:translateY(-2px);}
    .main-btn:disabled{opacity:.7; cursor:not-allowed; transform:none;}

    .hidden{display:none !important;}
    #message{margin-top:12px; font-size:.85rem;}
    .error-block{background:rgba(225,29,72,.08); border:1px solid rgba(225,29,72,.3); color:var(--err); padding:12px; border-radius:10px; text-align:left; display:flex; gap:10px;}
    .success-block{background:rgba(22,163,74,.08); border:1px solid rgba(22,163,74,.3); color:var(--ok); padding:12px; border-radius:10px; text-align:left;}

    .token-box{
        margin-top:15px; background:#f0fdf9; padding:15px; border-radius:12px;
        word-break:break-all; font-family:monospace; font-size:.8rem;
        border:1.5px dashed var(--neon); color:#047857; font-weight:600; text-align:left;
    }
    
    /* Loaders & Steps */
    .step-box { animation: fadeUp 0.4s ease; }
    @keyframes fadeUp { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
    .spinner { width:20px; height:20px; border:3px solid rgba(0,184,148,0.2); border-top-color:var(--neon); border-radius:50%; animation:spin 1s linear infinite; display:inline-block; vertical-align:middle; margin-right:8px;}
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .timer-text { font-size:0.75rem; color:var(--muted); margin-top:5px; text-align:center; }

    @media (max-width: 600px){
        body{padding:0; align-items:stretch;}
        .container{max-width:100%; min-height:100dvh; border-radius:0; display:flex; flex-direction:column; justify-content:center;}
    }
</style>
</head>
<body>
    <div class="container">
        <div class="brand">
            <h1>ERIIC <span class="amp">+</span> ANURAG MISHRA <span class="v7">V7</span></h1>
        </div>

        <!-- TABS -->
        <div class="tabs" id="main-tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" onclick="switchTab('recover')">Forgot Password</button>
        </div>

        <!-- ================= LOGIN FORM ================= -->
        <div id="login-form">
            <div class="input-group">
                <label>Email / User ID</label>
                <input type="text" id="uid" placeholder="Enter Email or ID">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter Password">
            </div>
            <button id="login-btn" class="main-btn" onclick="handleLogin()">⚡ GET TOKEN</button>
        </div>

        <!-- ================= 2FA FORM ================= -->
        <div id="2fa-form" class="hidden step-box">
            <div id="device-approval-box" style="text-align:center; padding:15px 0;">
                <div style="font-size:2.5rem; margin-bottom:10px; animation:pulse 2s infinite;">📱</div>
                <h3 style="margin:0 0 5px; font-size:1rem;">Check your other device</h3>
                <p style="font-size:0.8rem; color:var(--muted); margin-bottom:10px;">Approve the login request on your logged-in device.</p>
                <div class="spinner"></div>
                <div style="font-size:0.8rem; color:var(--warn); font-weight:600; margin-top:5px;">Waiting for approval...</div>
            </div>

            <div id="otp-box" class="hidden" style="margin-top: 15px;">
                <div class="input-group" style="text-align: center;">
                    <label>Enter Code (SMS/Auth App)</label>
                    <input type="text" id="otp" placeholder="••••••" maxlength="6" style="text-align:center; letter-spacing:5px; font-size:1.2rem;">
                </div>
                <button id="otp-btn" class="main-btn" onclick="submitOTP()">✅ VERIFY CODE</button>
            </div>

            <div style="margin: 15px 0; border-top: 1px solid var(--line);"></div>
            <button id="try-another-btn" style="background:none; border:none; color:var(--neon); font-weight:700; font-size:0.85rem; text-decoration:underline; cursor:pointer;" onclick="toggleOTPBox()">Try another way (SMS Code)</button>
            <button style="background:none; border:none; color:var(--err); font-weight:700; font-size:0.85rem; margin-top:10px; display:block; width:100%; cursor:pointer;" onclick="cancel2FA()">Cancel</button>
        </div>

        <!-- ================= FORGOT PASSWORD (RECOVERY) FORM ================= -->
        <div id="recover-form" class="hidden">
            
            <!-- Step 1: Send OTP -->
            <div id="rec-step1" class="step-box">
                <div class="input-group">
                    <label>Email / Phone Number</label>
                    <input type="text" id="rec-uid" placeholder="Enter Email or Phone">
                </div>
                <button id="rec-btn1" class="main-btn" onclick="recSendOTP()">📩 SEND OTP</button>
            </div>

            <!-- Step 2: Verify OTP -->
            <div id="rec-step2" class="hidden step-box">
                <div class="input-group" style="text-align:center;">
                    <label>Enter OTP</label>
                    <input type="text" id="rec-otp" placeholder="••••••" maxlength="6" style="text-align:center; letter-spacing:5px; font-size:1.2rem;">
                </div>
                <button id="rec-btn2" class="main-btn" onclick="recVerifyOTP()">✅ VERIFY OTP</button>
            </div>

            <!-- Step 3: New Password & Login -->
            <div id="rec-step3" class="hidden step-box">
                <div class="input-group">
                    <label>Set New Password</label>
                    <input type="password" id="rec-newpw" placeholder="Enter New Password">
                </div>
                <button id="rec-btn3" class="main-btn" onclick="recResetAndLogin()">🔓 RESET & GET TOKEN</button>
            </div>

        </div>

        <!-- MESSAGES & RESULT -->
        <div id="message"></div>

        <div id="result" class="hidden step-box">
            <p style="color:var(--ok); font-weight:900; margin-bottom:10px;">✅ SUCCESSFUL</p>
            <div class="token-box" id="token-display"></div>
            <button class="main-btn" style="background:#1a1a2e; margin-top:15px;" onclick="copyToken()">📋 COPY TOKEN</button>
        </div>
    </div>

    <script>
        let currentSessionId = '';
        let recSessionId = '';
        let pollInterval = null;

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-btn')[tab === 'login' ? 0 : 1].classList.add('active');
            
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('recover-form').classList.add('hidden');
            document.getElementById('result').classList.add('hidden');
            document.getElementById('2fa-form').classList.add('hidden');
            clearMsg();

            if(tab === 'login') {
                document.getElementById('login-form').classList.remove('hidden');
            } else {
                document.getElementById('recover-form').classList.remove('hidden');
                // Reset recover steps
                document.getElementById('rec-step1').classList.remove('hidden');
                document.getElementById('rec-step2').classList.add('hidden');
                document.getElementById('rec-step3').classList.add('hidden');
            }
        }

        function showError(text) { document.getElementById('message').innerHTML = `<div class="error-block">✕ ${text}</div>`; }
        function showSuccessMsg(text) { document.getElementById('message').innerHTML = `<div class="success-block">✓ ${text}</div>`; }
        function clearMsg() { document.getElementById('message').innerHTML = ''; }

        // ================= LOGIN FLOW =================
        async function handleLogin() {
            const uid = document.getElementById('uid').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            if(!uid || !password) return showError('Required fields missing');
            
            btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> WAIT...';
            clearMsg();

            const fd = new FormData(); fd.append('uid', uid); fd.append('password', password);
            try {
                const res = await fetch('/login', { method: 'POST', body: fd });
                const data = await res.json();
                btn.disabled = false; btn.innerHTML = '⚡ GET TOKEN';

                if(data.two_factor) {
                    currentSessionId = data.session_id;
                    document.getElementById('login-form').classList.add('hidden');
                    document.getElementById('2fa-form').classList.remove('hidden');
                    if(data.device_approval) startPolling();
                    else toggleOTPBox();
                } else if(data.success) {
                    showResult(data.token);
                } else {
                    showError(data.error);
                }
            } catch(e) { btn.disabled = false; btn.innerHTML = '⚡ GET TOKEN'; showError('Network error'); }
        }

        function startPolling() {
            if(pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(async () => {
                const fd = new FormData(); fd.append('session_id', currentSessionId); fd.append('otp', '');
                try {
                    const res = await fetch('/two_factor', { method: 'POST', body: fd });
                    const data = await res.json();
                    if(data.success) { clearInterval(pollInterval); showResult(data.token); }
                    else if(!data.waiting) { clearInterval(pollInterval); showError(data.error); setTimeout(cancel2FA, 2000); }
                } catch(e) {}
            }, 4000);
        }

        function toggleOTPBox() {
            document.getElementById('device-approval-box').classList.add('hidden');
            document.getElementById('otp-box').classList.remove('hidden');
            document.getElementById('try-another-btn').classList.add('hidden');
            if(pollInterval) clearInterval(pollInterval);
        }

        async function submitOTP() {
            const otp = document.getElementById('otp').value.trim();
            if(!otp) return showError('Enter OTP');
            
            const btn = document.getElementById('otp-btn'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> VERIFYING...';
            const fd = new FormData(); fd.append('session_id', currentSessionId); fd.append('otp', otp);
            try {
                const res = await fetch('/two_factor', { method: 'POST', body: fd });
                const data = await res.json();
                btn.disabled = false; btn.innerHTML = '✅ VERIFY CODE';
                if(data.success) showResult(data.token);
                else showError(data.error);
            } catch(e) { btn.disabled = false; btn.innerHTML = '✅ VERIFY CODE'; showError('Network error'); }
        }

        function cancel2FA() {
            if(pollInterval) clearInterval(pollInterval);
            document.getElementById('2fa-form').classList.add('hidden');
            document.getElementById('login-form').classList.remove('hidden');
            clearMsg();
        }

        // ================= RECOVERY FLOW =================
        async function recSendOTP() {
            const uid = document.getElementById('rec-uid').value.trim();
            if(!uid) return showError('Enter Email/Phone');
            
            const btn = document.getElementById('rec-btn1'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> SENDING...';
            clearMsg();
            
            const fd = new FormData(); fd.append('uid', uid);
            try {
                const res = await fetch('/recover/send', { method: 'POST', body: fd });
                const data = await res.json();
                btn.disabled = false; btn.innerHTML = '📩 SEND OTP';
                
                if(data.success) {
                    recSessionId = data.recover_id;
                    document.getElementById('rec-step1').classList.add('hidden');
                    document.getElementById('rec-step2').classList.remove('hidden');
                    showSuccessMsg('OTP Sent! Check your Email/SMS.');
                } else {
                    showError(data.error);
                }
            } catch(e) { btn.disabled = false; btn.innerHTML = '📩 SEND OTP'; showError('Network error'); }
        }

        async function recVerifyOTP() {
            const otp = document.getElementById('rec-otp').value.trim();
            if(!otp) return showError('Enter OTP');
            
            const btn = document.getElementById('rec-btn2'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> VERIFYING...';
            clearMsg();
            
            const fd = new FormData(); fd.append('recover_id', recSessionId); fd.append('otp', otp);
            try {
                const res = await fetch('/recover/verify', { method: 'POST', body: fd });
                const data = await res.json();
                btn.disabled = false; btn.innerHTML = '✅ VERIFY OTP';
                
                if(data.success) {
                    document.getElementById('rec-step2').classList.add('hidden');
                    document.getElementById('rec-step3').classList.remove('hidden');
                    showSuccessMsg('OTP Verified! Set new password.');
                } else {
                    showError(data.error);
                }
            } catch(e) { btn.disabled = false; btn.innerHTML = '✅ VERIFY OTP'; showError('Network error'); }
        }

        async function recResetAndLogin() {
            const pw = document.getElementById('rec-newpw').value;
            if(!pw || pw.length < 6) return showError('Password min 6 chars');
            
            const btn = document.getElementById('rec-btn3'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> BYPASSING...';
            clearMsg();
            
            const fd = new FormData(); fd.append('recover_id', recSessionId); fd.append('password', pw);
            try {
                const res = await fetch('/recover/reset', { method: 'POST', body: fd });
                const data = await res.json();
                btn.disabled = false; btn.innerHTML = '🔓 RESET & GET TOKEN';
                
                if(data.success) {
                    showResult(data.token);
                } else {
                    showError(data.error);
                }
            } catch(e) { btn.disabled = false; btn.innerHTML = '🔓 RESET & GET TOKEN'; showError('Network error'); }
        }

        // ================= COMMON =================
        function showResult(token) {
            if(pollInterval) clearInterval(pollInterval);
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('2fa-form').classList.add('hidden');
            document.getElementById('recover-form').classList.add('hidden');
            document.getElementById('main-tabs').classList.add('hidden');
            document.getElementById('result').classList.remove('hidden');
            document.getElementById('token-display').innerText = token;
            clearMsg();
        }

        function copyToken() {
            navigator.clipboard.writeText(document.getElementById('token-display').innerText).then(() => alert('Token Copied!'));
        }
    </script>
</body>
</html>
